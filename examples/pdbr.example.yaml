# pdbr reference configuration.
# Generated by `pdbr config example` from the config structs — reference, not for direct use.
# Every key is also settable via env (PDBR_SECTION_KEY, double underscore for '_' in names)
# or command-line flags; precedence is flags > env > file.

database:
  # PostgreSQL connection URL, e.g. postgres://user:pass@host:5432/db. Also honours standard PG* env vars when empty.
  url: ""
  # Maximum pooled connections.
  max_conns: 10
  # Timeout for establishing a connection.
  connect_timeout: "10s"
  # Per-statement timeout applied to every request (0 disables).
  statement_timeout: "30s"

server:
  # Listen address for the HTTP server.
  addr: ":8080"
  # Prefix for every API route ("" mounts at the root). /healthz and /readyz are never prefixed.
  base_path: "/api"
  # Serve the OpenAPI 3.1 document at GET {base_path}/openapi.json (on by default; it reveals every table, column, relation and function to unauthenticated callers).
  openapi: true
  # Overall HTTP request timeout; expiry answers 504.
  request_timeout: "30s"
  # Maximum accepted request body size in bytes; over answers 413.
  max_body_bytes: 1048576
  # Maximum select= embed nesting depth; deeper answers 400 embed_depth_exceeded.
  max_embed_depth: 5
  # Maximum estimated cost (1 + list multipliers) per request; over answers 400 cost_exceeded. @costMultiplier smart comments tune the estimate.
  max_cost: 10000
  # Largest accepted limit (larger answers 400 page_size_exceeded); also the page size when limit is absent.
  max_page_size: 100
  # Allowed CORS origins (exact match, or '*' for any). Empty disables CORS headers and preflight entirely.
  cors_origins: []
  # Gzip responses for clients that send Accept-Encoding: gzip (off by default).
  compression: false
  # Answer every write with 405 (code read_only) for read replicas, maintenance or demos. Also toggleable at runtime when embedding pdbr as a library (App.SetReadOnly).
  read_only: false
  # Weak ETag on single-row GETs, If-None-Match answering 304, If-Match on PATCH/DELETE answering 412. Disable when column-level grants deny SELECT on some columns (the ETag hashes the whole row).
  etags: true
  # Honour Accept: text/csv on list GETs and set-returning RPCs.
  csv: true

schema:
  # PostgreSQL schemas to expose.
  schemas: ["public"]
  # Boot from this schema cache file instead of introspecting (see pdbr schema dump).
  cache_path: ""
  # Expose PostgreSQL functions as /rpc/{fn} routes and computed columns.
  functions: true
  # Expose each partition of a partitioned table as a resource of its own. Off by default: a partition's rows are already reachable (and writable) through its partitioned parent, which stays a resource either way.
  expose_partitions: false

filters:
  # Only allow filtering on columns covered by an index (default policy).
  indexed_only: true
  # Per-table extra filterable columns, keyed by schema.table, overriding indexed_only.
  allow_columns: {}

rls:
  # Run each request as a switched role with claims exposed via set_config (SET LOCAL). Disabling uses the privileged connection directly and logs a loud warning.
  enabled: true
  # Role assumed for authenticated requests without a role claim.
  default_role: ""
  # Role assumed for unauthenticated requests.
  anonymous_role: "anonymous"
  # JWT claim (or header name in header mode) carrying the database role.
  role_claim: "role"
  # Roles a request may assume via the role claim. Empty allows any role (subject to database grants); default_role and anonymous_role are always allowed.
  allowed_roles: []
  # set_config namespace for request claims. Defaults to pdbq.claims so RLS policies written for pdbq work unchanged.
  claims_prefix: "pdbq.claims"
  auth:
    # Claim source: 'jwt', 'headers' (behind a trusted gateway), or 'none'.
    mode: "jwt"
    # HMAC secret for HS256/384/512 verification (jwt mode; ignored when jwks_url is set).
    jwt_secret: ""
    # JWKS endpoint for asymmetric JWT verification (RS256/384/512, ES256/384/512). Takes precedence over jwt_secret.
    jwks_url: ""
    # How long fetched JWKS keys are cached; an unknown kid triggers an early refresh (key rotation).
    jwks_cache_ttl: "1h0m0s"
    # Expected iss claim; empty skips the check.
    jwt_issuer: ""
    # Expected aud claim; empty skips the check.
    jwt_audience: ""
    # Header prefix mapped to claims in headers mode, e.g. X-Pdbr-Claim-.
    header_prefix: "X-Pdbr-Claim-"
    # CIDR blocks (or single IPs) allowed to supply claim headers in headers mode. Requests from other peers that carry claim headers are rejected. Empty trusts every peer and logs a startup warning.
    trusted_proxies: []
    # Schema-qualified composite type (e.g. public.jwt) minted into a signed JWT: any function returning it yields an HS256 token string built from the composite's fields (an exp field becomes the token expiry). Requires jwt_secret; jwt_issuer/jwt_audience are embedded when set. Empty disables minting.
    jwt_type: ""

transactions:
  # Wrap every mutation in a transaction.
  mutations: true
  # Transaction isolation level: read_committed, repeatable_read, serializable.
  isolation: "read_committed"
  # Automatic retries of a transactional operation after a serialization failure or deadlock (SQLSTATE 40001/40P01). 0 disables; the whole operation re-runs, which is safe because the failed attempt rolled back.
  max_retries: 0

watch:
  # Re-introspect and hot-swap the schema on DDL changes (dev only; refuses to combine with schema.cache_path).
  enabled: false
  # Poll interval used when event triggers cannot be installed.
  poll_interval: "5s"
  # NOTIFY channel used by the DDL event trigger.
  channel: "pdbr_ddl"

errors:
  # 'dev' exposes full PostgreSQL error detail (plus a pg object) in problem responses; 'prod' sanitizes but passes constraint-violation and bad-input messages through; 'strict' hides every database error message (constraint and column names never leak).
  detail: "prod"

plugins:
  # Plugin names to disable.
  disabled: []
  # Per-plugin configuration, keyed by plugin name.
  settings: {}

log:
  # Log level: debug, info, warn, error.
  level: "info"
  # Log format: text or json.
  format: "text"

