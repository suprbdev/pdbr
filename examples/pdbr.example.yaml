# pdbr reference configuration.
# Generated by `pdbr config example` from the config structs — reference, not for direct use.
# Every key is also settable via env (PDBR_SECTION_KEY, double underscore for '_' in names)
# or command-line flags; precedence is flags > env > file.

database:
  # PostgreSQL connection URL, e.g. postgres://user:pass@host:5432/db. Also honours standard PG* env vars when empty.
  url: ""
  # Maximum pooled connections.
  max_conns: 10
  # Timeout for establishing a connection.
  connect_timeout: "10s"
  # Per-statement timeout applied to every request (0 disables). Keep it below the HTTP request timeout so a slow statement fails with SQLSTATE 57014 (a timeout error the client can act on) before the request is cut off.
  statement_timeout: "25s"

server:
  # Listen address for the HTTP server.
  addr: ":8080"
  # Prefix for every API route, e.g. /api ("", the default, mounts at the root like PostgREST). /healthz and /readyz are never prefixed.
  base_path: ""
  # Overall HTTP request timeout; expiry answers 504.
  request_timeout: "30s"
  # Timeout of the database ping behind GET /readyz; an unreachable or slow database answers 503 unavailable. /healthz stays a liveness check.
  readyz_timeout: "2s"
  # Allowed CORS origins (exact match, or '*' for any). Empty disables CORS headers and preflight entirely.
  cors_origins: []
  # Gzip responses for clients that send Accept-Encoding: gzip (off by default).
  compression: false
  # Answer every write with 405 (code read_only) for read replicas, maintenance or demos. Also toggleable at runtime when embedding pdbr as a library (App.SetReadOnly).
  read_only: false
  # Weak ETag on single-row GETs, If-None-Match answering 304, If-Match on PATCH/DELETE answering 412. The hash covers every column the resource exposes (not @omit / @omit read ones); disable when column-level grants deny SELECT on an exposed column.
  etags: true
  # Honour Accept: text/csv on list GETs and set-returning RPCs.
  csv: true
  # Prefix CSV header and string cells that start with =, +, -, @, a tab or a carriage return with a single quote, so spreadsheets do not evaluate them as formulas (CSV injection). Numbers are never escaped. Disable only when every consumer reads the CSV as data.
  csv_escape_formulas: true

openapi:
  # Serve the OpenAPI 3.1 document at GET {base_path}/openapi.json (on by default; it reveals every table, column, relation and function to unauthenticated callers, as pdbq's introspection does).
  enabled: true
  # The document's info.title.
  title: "pdbr"
  # Absolute URL of the API's origin as clients reach it (e.g. https://api.example.com behind a proxy), put before the base path in servers[0].url; empty gives the base path alone (a relative URL).
  server_url: ""

limits:
  # Maximum accepted request body size in bytes; over answers 413.
  max_body_bytes: 1048576
  # Maximum select= embed nesting depth; deeper answers 400 embed_depth_exceeded.
  max_depth: 5
  # Maximum estimated cost (1 + list multipliers) per request; over answers 400 cost_exceeded. A list counts the rows the SQL can fetch: its limit, else max_page_size (to-many embeds included). @costMultiplier smart comments tune the estimate.
  max_cost: 100000
  # Largest accepted limit (larger answers 400 page_size_exceeded); also the page size when limit is absent.
  max_page_size: 100
  # Characters of a document a full-text headline (<col>_headline) reads: a text document is cut to its first max_headline_document characters, a json or jsonb document longer than that gives a null headline. ts_headline re-parses its document on every call, so each headline costs 10 per started 8192 characters of this bound in max_cost.
  max_headline_document: 65536

schema:
  # PostgreSQL schemas to expose.
  schemas: ["public"]
  # Boot from this schema cache file instead of introspecting (see pdbr schema dump).
  cache_path: ""
  # Expose PostgreSQL functions as /rpc/{fn} routes and computed columns.
  functions: true
  # Expose each partition of a partitioned table as a resource of its own. Off by default: a partition's rows are already reachable (and writable) through its partitioned parent, which stays a resource either way.
  expose_partitions: false
  # Document each domain over a built-in type as a named component schema (its base type's schema, the domain's comment and constraints, pattern/minimum/maximum when a CHECK is a simple comparison) that columns, arguments and results reference. Off inlines the base type's schema.
  domains: true

filters:
  # Only allow filtering on columns covered by an index (default policy).
  indexed_only: true
  # Per-table extra filterable columns, keyed by schema.table, overriding indexed_only.
  allow_columns: {}

mutations:
  # Allow PATCH and DELETE on a collection route without a filter (every visible row). Off by default: such requests answer 400 unfiltered_mutation.
  allow_unfiltered: false

aggregates:
  # Allow aggregate functions in select= (count(), col.sum(), col.avg(), col.max(), col.min(); col.extent(), col.union(), col.collect(), col.centroid() on spatial columns), grouped by the other selected items, on every resource. Off by default (PostgREST db-aggregates-enabled): an aggregate reads every row its filters match, which limit does not bound; requests answer 400 aggregates_disabled.
  enabled: false

auth:
  # Credential source: 'jwt' (verify a bearer JWT), 'headers' (claims set by a trusted gateway) or 'none' (no credentials: every request is anonymous).
  mode: "jwt"
  # JWT verification (jwt mode) and the key minting signs with.
  jwt:
    # HMAC secret verifying HS256/384/512 tokens (ignored for verification when jwks_url is set) and signing minted tokens.
    secret: ""
    # File holding the HMAC secret (trailing newlines are stripped), instead of secret.
    secret_file: ""
    # JWKS endpoint for asymmetric JWT verification (RS256/384/512, ES256/384/512). Takes precedence over secret.
    jwks_url: ""
    # How long fetched JWKS keys are cached; an unknown kid triggers an early refresh (key rotation) at most once a minute. After the TTL, keys refresh in the background and stay in use for up to one more TTL while the endpoint fails; failed fetches back off from 1s to 1m.
    jwks_cache_ttl: "1h0m0s"
    # Expected iss claim; empty skips the check.
    issuer: ""
    # Expected aud claim; empty skips the check.
    audience: ""
    # Clock skew tolerated when checking exp, nbf and iat.
    leeway: "0s"
    # Path of the claim carrying the database role: dot-separated keys with optional array indexes and double-quoted keys, e.g. role, app_metadata.role, realm_access.roles[0] or "https://example.com/role". A missing claim falls back to roles.default; a claim that is not a non-empty string is rejected.
    role_claim_path: "role"
  # Gateway claim headers (headers mode).
  headers:
    # Header prefix mapped to claims, e.g. X-Pdbr-Claim-. The rest of the name maps to one claim (User-Id is user_id); requests with a claim header containing an underscore or other punctuation, repeated, or folding onto another claim header are rejected. The gateway must strip every client-supplied header with this prefix, in any letter case.
    prefix: "X-Pdbr-Claim-"
    # Claim names (e.g. user_id) accepted from claim headers; role_claim is always accepted. Requests carrying any other claim header are rejected. Empty accepts any claim.
    claims: []
    # Claim carrying the database role (role is sent as <prefix>Role). A missing claim falls back to roles.default.
    role_claim: "role"
    # CIDR blocks (or single IPs) allowed to send claim headers; required in headers mode. Requests from other peers that carry claim headers are rejected.
    trusted_proxies: []
  # Schema-qualified composite type (e.g. public.jwt) minted into a signed JWT: any function returning it yields an HS256 token string built from the composite's fields (an exp field becomes the token expiry). Requires jwt.secret or jwt.secret_file; jwt.issuer/jwt.audience are embedded when set. Empty disables minting.
  mint_type: ""

roles:
  # Run each request as its resolved role (SET LOCAL ROLE). Disabling runs every request as the connection role, with credentials still verified and claims still set; it logs a loud warning.
  switch: true
  # Role of requests without credentials (every request in auth mode none). Empty refuses requests without credentials with 401 (auth modes jwt and headers).
  anonymous: ""
  # Role of authenticated requests without a role claim; empty falls back to anonymous, and a request that resolves to no role is refused.
  default: ""
  # Roles a request may assume via its role claim. Empty allows any role (subject to database grants); default and anonymous are always allowed.
  allowed: []

claims:
  # Namespace of the per-claim settings: claim user_id is current_setting('jwt.claims.user_id', true) with the default (PostGraphile's). Empty sets no per-claim settings.
  prefix: "jwt.claims"
  # Setting that receives every claim as one JSON object ('{}' without credentials), e.g. request.jwt.claims (PostgREST's: current_setting('request.jwt.claims', true)::json->>'sub'). Empty sets none.
  json_setting: ""

transactions:
  # Transaction isolation level: read_committed, repeatable_read, serializable.
  isolation: "read_committed"
  # Automatic retries of a transactional operation after a serialization failure or deadlock (SQLSTATE 40001/40P01). 0 disables; the whole operation re-runs, which is safe because the failed attempt rolled back.
  max_retries: 0
  # How a write's transaction ends (PostgREST db-tx-end): commit, commit-allow-override, rollback or rollback-allow-override. rollback runs every write (POST, PUT, PATCH, DELETE, volatile RPCs) and discards its effects while still answering with the result; the -allow-override forms honour Prefer: tx=commit|rollback, echoed in Preference-Applied. Without an override form Prefer: tx= is ignored, or 400 invalid_preference under handling=strict.
  end: "commit"
  # Partial success: each element of a bulk POST or PUT in its own savepoint.
  partial:
    # Let a bulk POST or PUT opt in (Prefer: partial=items) to running each element in its own savepoint, so a failing element is reported without rolling back the others. The response is then 207 with a per-element report whenever one failed. Off by default: the token is ignored, or 400 invalid_preference under handling=strict.
    enabled: false
    # Most elements a bulk POST or PUT may carry when it opts in with Prefer: partial=items; each element is its own statement and savepoint, so this bounds the round trips one request makes. Larger bodies answer 413 body_too_large.
    max_items: 1000

watch:
  # Re-introspect and hot-swap the schema on DDL changes (dev only; refuses to combine with schema.cache_path).
  enabled: false
  # Poll interval used when event triggers cannot be installed.
  poll_interval: "5s"
  # NOTIFY channel used by the DDL event trigger.
  channel: "pdbr_ddl"

errors:
  # 'dev' exposes full PostgreSQL error detail (plus a pg object) in problem responses; 'prod' sanitizes but passes constraint-violation and bad-input messages through; 'strict' hides every database error message (constraint and column names never leak).
  detail: "prod"

plugins:
  # Plugin names to disable.
  disabled: []
  # Per-plugin settings, one section per plugin.
  settings:
    # advanced_filters plugin: relation filters, related-column ordering and computed-column filter/order.
    advanced_filters:
      # Relation filters (rel.col=op.v, rel!none., rel!every., rel=exists.true|false).
      relations: true
      # Filtering and ordering on computed columns (follows schema.functions).
      computed: true
      # Ordering by a related column (order=rel(col).asc); off when relations is off.
      relation_order: true
      # Only foreign keys tagged @filterable (or @sortable) get relation filters and ordering.
      relations_opt_in: false
      # Only computed-column functions tagged @filterable (or @sortable) get filters and ordering.
      computed_opt_in: false
    # postgis plugin: the spatial query surface of geometry, geography and raster columns.
    postgis:
      # Spatial filter operators (st_*, bbox_*) on spatial columns and the intersects filter on raster columns.
      filters: true
      # Derived pseudo-columns: <col>_area, <col>_centroid, ... on spatial columns, <col>_width, <col>_value, <col>_summary_stats, ... on raster columns.
      derived: true
      # Distance ordering (order=<col>.dist.asc|desc) and the <col>_distance score, both with near=.
      ordering: true
      # select= projection arguments: col(transform=...,simplify=...,buffer=...,precision=...).
      projection: true
      # Spatial aggregate functions in select= (col.extent(), col.union(), col.collect(), col.centroid()); also needs aggregates.enabled.
      aggregates: true
    # nested_mutations plugin: related rows written in the same statement as a POST or PATCH.
    nested_mutations:
      # Deepest nesting of create/update operations (the root row is depth 1; connect, delete and disconnect add no level); deeper answers 400 embed_depth_exceeded.
      max_depth: 3
      # Most nested operations per request (every list item and forward operation counts once); more answers 400 invalid_body.
      max_operations: 50

log:
  # Log level: debug, info, warn, error.
  level: "info"
  # Log format: text or json.
  format: "text"

metrics:
  # Serve Prometheus metrics (HTTP requests, database operations, pool statistics, schema rebuilds).
  enabled: false
  # URL path of the metrics endpoint.
  path: "/metrics"
  # Separate listen address for the metrics endpoint, e.g. :9090, keeping it off the public listener; empty serves it on the main server address.
  addr: ""

# Schema contracts: named APIs for different audiences, each a subset of the full API selected by @contract / @behavior ±contract:<name> smart comments and served with its own OpenAPI document under its own base path. Entries are {name, default: include|exclude, path (default <server.base_path>/<name>)}, or bare names. When set, only the contracts are served (give one contract path: / to serve it at the root). Requires the smart_comments plugin.
contracts: []
