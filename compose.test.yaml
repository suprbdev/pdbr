# Test database only — used by `make test-e2e` and CI.
services:
  db:
    # PostGIS-enabled image: the fixture schema creates the extension so the
    # e2e suite can exercise spatial filters. Same Postgres 18 otherwise.
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_USER: pdbr
      POSTGRES_PASSWORD: pdbr
      POSTGRES_DB: pdbr_test
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdbr"]
      interval: 2s
      timeout: 2s
      retries: 15
